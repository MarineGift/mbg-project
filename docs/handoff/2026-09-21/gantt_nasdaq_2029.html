.row{display:contents}

": "2029-05-01", "end": "2029-08-31", "gate": true}, {"code": "S-CP-05", "phase": "P5", "ws": "capital", "title": "File Nasdaq listing application, agreement and governance certification; 4–6 week review", "rule": "5505", "start": "2029-07-15", "end": "2029-08-31", "gate": true}, {"code": "S-CP-06", "phase": "P5", "ws": "capital", "title": "Public S-1 filing — at least 15 days before roadshow", "rule": "JOBS Act", "start": "2029-09-01", "end": "2029-09-15", "gate": true}, {"code": "S-CP-07", "phase": "P5", "ws": "capital", "title": "Secure three registered market makers", "rule": "5505(a)", "start": "2029-07-01", "end": "2029-09-30", "gate": true}, {"code": "S-IR-01", "phase": "P5", "ws": "ir", "title": "IR website, disclosure controls and Reg FD policy live", "rule": "5250(d)", "start": "2029-06-01", "end": "2029-08-31", "gate": false}, {"code": "L-CP-01", "phase": "P6", "ws": "capital", "title": "Roadshow and book-building", "rule": null, "start": "2029-10-01", "end": "2029-10-31", "gate": false}, {"code": "L-CP-02", "phase": "P6", "ws": "capital", "title": "Pricing and S-1 effectiveness", "rule": null, "start": "2029-11-01", "end": "2029-11-15", "gate": true}, {"code": "L-CP-03", "phase": "P6", "ws": "capital", "title": "Nasdaq listing and first trade", "rule": null, "start": "2029-11-15", "end": "2029-11-30", "gate": true}, {"code": "L-CP-04", "phase": "P6", "ws": "capital", "title": "Switch to continued-listing (5550) monitoring", "rule": "5550", "start": "2029-12-01", "end": "2029-12-31", "gate": true}, {"code": "L-FA-01", "phase": "P6", "ws": "finance_audit", "title": "First 10-Q after listing", "rule": null, "start": "2030-01-01", "end": "2030-02-28", "gate": false}, {"code": "L-FA-02", "phase": "P6", "ws": "finance_audit", "title": "First 10-K and management ICFR assessment", "rule": "SOX 404(a)", "start": "2030-01-01", "end": "2030-03-31", "gate": false}, {"code": "L-LG-01", "phase": "P6", "ws": "legal_gov", "title": "First annual shareholder meeting after listing", "rule": "5620(a)", "start": "2030-04-01", "end": "2030-06-30", "gate": false}], "deps": [["F-IP-02", "F-IP-01"], ["C-CM-02", "F-IP-01"], ["C-CM-03", "C-CM-02"], ["C-FA-02", "C-FA-01"], ["C-FA-03", "C-CM-03"], ["C-CM-06", "C-CM-05"], ["A-FA-02", "A-FA-01"], ["A-FA-02", "C-CM-03"], ["A-FA-03", "A-FA-02"], ["A-FA-06", "A-FA-05"], ["G-AC-02", "G-AC-01"], ["G-AC-03", "G-AC-02"], ["K-CP-03", "A-FA-02"], ["K-CP-05", "K-CP-03"], ["D-GO-02", "A-FA-03"], ["D-GO-02", "D-GO-01"], ["D-GO-03", "K-CP-03"], ["S-CP-03", "D-GO-02"], ["S-CP-03", "A-FA-03"], ["S-CP-03", "G-AC-01"], ["S-CP-04", "S-CP-03"], ["S-CP-05", "S-CP-04"], ["S-CP-06", "S-CP-04"], ["L-CP-02", "S-CP-06"], ["L-CP-03", "S-CP-05"], ["L-CP-03", "S-CP-07"], ["L-CP-03", "L-CP-02"]], "decisions": [{"stage": "gate1", "name": "Gate 1 — Preliminary Go/No-Go", "start": "2028-12-01", "end": "2028-12-15", "purpose": "Direction call on FY2028 preliminary results, commercialization and run-rate"}, {"stage": "gate2", "name": "Gate 2 — Final Internal Go/No-Go", "start": "2029-03-15", "end": "2029-03-31", "purpose": "Confirm with FY2028 PCAOB audit results"}, {"stage": "gate3", "name": "Gate 3 — Underwriter Validation", "start": "2029-01-01", "end": "2029-06-30", "purpose": "Capital-market feasibility via underwriter bake-off"}], "windows": [{"name": "Accelerated — 2029 Q4", "start": "2029-10-01", "end": "2029-12-31"}, {"name": "Base — 2030 Q2", "start": "2030-04-01", "end": "2030-06-30"}]};
const $ = s => document.querySelector(s);
const parse = s => new Date(s + 'T00:00:00');
const start = parse(D.program.start), end = parse(D.program.end);
const months = []; { let d = new Date(start); while (d <= end) { months.push(new Date(d)); d = new Date(d.getFullYear(), d.getMonth()+1, 1); } }
const col = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--col'));
const monthIndex = d => (d.getFullYear()-start.getFullYear())*12 + (d.getMonth()-start.getMonth()) + (d.getDate()-1)/30;
const x = d => monthIndex(parse(d)) * col();

$('#title').textContent = D.program.name;
$('#buildto').textContent = D.program.build_to;
$('#window').textContent = D.program.window;
$('#today').textContent = D.program.today;

const wsMap = Object.fromEntries(D.ws.map(w => [w.code, w]));
const state = { ws: new Set(D.ws.map(w => w.code)), gatesOnly: false, collapsed: new Set() };

// controls
const ctl = $('#controls');
D.ws.forEach(w => {
  const b = document.createElement('button'); b.className = 'chip'; b.setAttribute('aria-pressed','true');
  b.innerHTML = `<span class="sw" style="background:${w.color}"></span>${w.name}`;
  b.onclick = () => { const on = b.getAttribute('aria-pressed')==='true'; b.setAttribute('aria-pressed', String(!on)); on ? state.ws.delete(w.code) : state.ws.add(w.code); apply(); };
  ctl.appendChild(b);
});
const sep = document.createElement('span'); sep.className='sep'; ctl.appendChild(sep);
const gb = document.createElement('button'); gb.className='chip'; gb.setAttribute('aria-pressed','false'); gb.textContent='관문만 보기';
gb.onclick = () => { state.gatesOnly = !state.gatesOnly; gb.setAttribute('aria-pressed', String(state.gatesOnly)); apply(); };
ctl.appendChild(gb);

// header
const grid = $('#grid');
const lh = document.createElement('div'); lh.className='lhead'; lh.textContent = `${D.milestones.length}개 마일스톤 · ${D.milestones.filter(m=>m.gate).length}개 관문`; grid.appendChild(lh);
const th = document.createElement('div'); th.className='thead';
const yrs = document.createElement('div'); yrs.className='years';
let i = 0; while (i < months.length) { const y = months[i].getFullYear(); let n=0; while (i+n<months.length && months[i+n].getFullYear()===y) n++; const d=document.createElement('div'); d.style.width=`calc(var(--col)*${n})`; d.textContent=y; yrs.appendChild(d); i+=n; }
const mos = document.createElement('div'); mos.className='months';
months.forEach(m => { const d=document.createElement('div'); d.textContent = m.getMonth()+1; if ((m.getMonth()+1)%3===0) d.classList.add('q'); mos.appendChild(d); });
th.appendChild(yrs); th.appendChild(mos); grid.appendChild(th);

// rows
const rows = [];
function addRow(kind, code, label, s, e, extra={}) {
  const r = document.createElement('div'); r.className='row'; r.dataset.kind=kind; r.dataset.code=code;
  const l = document.createElement('div'); l.className='lcell '+kind;
  l.innerHTML = `<span class="code">${code}</span><span class="t">${label}</span>`;
  const t = document.createElement('div'); t.className='tcell '+kind;
  const bar = document.createElement('div'); bar.className='bar';
  bar.style.left = x(s)+'px'; bar.style.width = Math.max(col()*0.6, x(e)-x(s))+'px';
  if (extra.color) bar.style.background = extra.color;
  t.appendChild(bar);
  if (extra.gate) { const g=document.createElement('div'); g.className='gate'; g.style.left=(x(e)-6)+'px'; t.appendChild(g); }
  r.appendChild(l); r.appendChild(t); grid.appendChild(r);
  Object.assign(r, {kind, code, extra});
  rows.push(r); return r;
}
const byPhase = {};
D.milestones.forEach(m => (byPhase[m.phase] ||= []).push(m));
D.phases.forEach(p => {
  const ms = byPhase[p.code] || [];
  const s = ms.map(m=>m.start).sort()[0], e = ms.map(m=>m.end).sort().slice(-1)[0];
  const pr = addRow('phase', p.code, `${p.name}  <span style="font-weight:400;color:var(--ink-2)">${p.label}</span>`, s, e);
  pr.querySelector('.lcell').onclick = () => { state.collapsed.has(p.code) ? state.collapsed.delete(p.code) : state.collapsed.add(p.code); apply(); };
  pr.querySelector('.lcell').tabIndex = 0;
  pr.querySelector('.lcell').onkeydown = ev => { if (ev.key==='Enter'||ev.key===' ') { ev.preventDefault(); pr.querySelector('.lcell').click(); } };
  ms.forEach(m => {
    const r = addRow('milestone', m.code, m.title, m.start, m.end, {color: wsMap[m.ws].color, gate: m.gate, m});
    r.phase = p.code;
    const l = r.querySelector('.lcell'); l.tabIndex = 0;
    const show = ev => { hi(m.code); tip(ev, m); }, hide = () => { hi(null); $('#tip').style.display='none'; };
    l.onmouseenter = show; l.onmouseleave = hide; l.onfocus = show; l.onblur = hide;
    r.querySelector('.tcell').onmouseenter = show; r.querySelector('.tcell').onmouseleave = hide;
  });
});

// decision bands + IPO windows (span all rows via absolutely positioned overlay in grid)
function band(cls, s, e, label) {
  const b = document.createElement('div'); b.className='band '+cls;
  b.style.left = `calc(var(--left) + ${x(s)}px)`; b.style.width = (x(e)-x(s)+col()*(1/30))+'px';
  if (label) { const l=document.createElement('label'); l.textContent=label; l.style.top='var(--head)'; b.appendChild(l); }
  grid.appendChild(b);
}
D.decisions.forEach(d => band('dec', d.start, d.end, d.name));
band('ipo', D.windows[0].start, D.windows[0].end, D.windows[0].name);
band('ipo2', D.windows[1].start, D.windows[1].end, D.windows[1].name);
const td = document.createElement('div'); td.className='today'; td.style.left=`calc(var(--left) + ${x(D.program.today)}px)`; td.innerHTML=`<span>오늘</span>`; grid.appendChild(td);

const preds = {}; D.deps.forEach(([a,b]) => (preds[a] ||= []).push(b));
function hi(code) {
  rows.forEach(r => { r.classList.remove('dim','pred'); });
  if (!code) return;
  const p = new Set(preds[code] || []);
  rows.forEach(r => { if (r.kind!=='milestone') return; if (r.code===code) return; if (p.has(r.code)) r.classList.add('pred'); else r.classList.add('dim'); });
}
function tip(ev, m) {
  const t = $('#tip'); const ws = wsMap[m.ws].name;
  t.innerHTML = `<b>${m.code} ${m.gate?'· 관문':''}</b>${m.title}<br>${m.start} → ${m.end} · ${ws}${m.rule?`<br>근거: ${m.rule}`:''}${(preds[m.code]||[]).length?`<br>선행: ${preds[m.code].join(', ')}`:''}`;
  t.style.display='block';
  const px = (ev.clientX||0)+14, py = (ev.clientY||0)+14;
  t.style.left = Math.min(px, window.innerWidth-360)+'px'; t.style.top = Math.min(py, window.innerHeight-120)+'px';
}
function apply() {
  rows.forEach(r => {
    if (r.kind==='phase') return;
    const m = r.extra.m;
    const show = state.ws.has(m.ws) && (!state.gatesOnly || m.gate) && !state.collapsed.has(r.phase);
    r.classList.toggle('hidden', !show);
  });
}
// scroll to today on load (keep a little context before it)
try { $('#wrap').scrollLeft = Math.max(0, x(D.program.today) - col()*2); } catch(e) {}
</script>
