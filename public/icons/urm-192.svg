<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="urmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34a853;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" fill="#ffffff"/>
  
  <!-- Rounded container -->
  <rect x="10" y="10" width="172" height="172" rx="40" fill="url(#urmGrad)"/>
  
  <!-- Dashboard grid -->
  <rect x="30" y="45" width="28" height="28" fill="#ffffff" opacity="0.9" rx="3"/>
  <rect x="70" y="45" width="28" height="28" fill="#ffffff" opacity="0.9" rx="3"/>
  <rect x="110" y="45" width="28" height="28" fill="#ffffff" opacity="0.75" rx="3"/>
  
  <!-- Chart bars -->
  <rect x="35" y="95" width="8" height="35" fill="#ffffff" opacity="0.85" rx="2"/>
  <rect x="50" y="85" width="8" height="45" fill="#ffffff" opacity="0.85" rx="2"/>
  <rect x="65" y="75" width="8" height="55" fill="#ffffff" opacity="0.85" rx="2"/>
  <rect x="80" y="90" width="8" height="40" fill="#ffffff" opacity="0.85" rx="2"/>
  
  <!-- Contact nodes -->
  <circle cx="120" cy="90" r="5" fill="#ffffff" opacity="0.8"/>
  <circle cx="135" cy="110" r="5" fill="#ffffff" opacity="0.8"/>
  <line x1="120" y1="90" x2="135" y2="110" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
</svg>
