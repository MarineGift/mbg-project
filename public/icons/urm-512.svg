<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="urmGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34a853;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#ffffff"/>
  
  <!-- Rounded container -->
  <rect x="30" y="30" width="452" height="452" rx="100" fill="url(#urmGrad512)"/>
  
  <!-- Dashboard cards -->
  <rect x="80" y="110" width="100" height="100" fill="#ffffff" opacity="0.9" rx="10"/>
  <rect x="206" y="110" width="100" height="100" fill="#ffffff" opacity="0.85" rx="10"/>
  <rect x="332" y="110" width="100" height="100" fill="#ffffff" opacity="0.8" rx="10"/>
  
  <!-- Chart bars -->
  <rect x="100" y="240" width="20" height="100" fill="#ffffff" opacity="0.85" rx="4"/>
  <rect x="140" y="200" width="20" height="140" fill="#ffffff" opacity="0.85" rx="4"/>
  <rect x="180" y="160" width="20" height="180" fill="#ffffff" opacity="0.85" rx="4"/>
  <rect x="220" y="190" width="20" height="150" fill="#ffffff" opacity="0.85" rx="4"/>
  
  <!-- Contact/Network nodes -->
  <circle cx="340" cy="280" r="15" fill="#ffffff" opacity="0.8"/>
  <circle cx="390" cy="240" r="15" fill="#ffffff" opacity="0.8"/>
  <circle cx="400" cy="320" r="12" fill="#ffffff" opacity="0.75"/>
  
  <!-- Connection lines -->
  <line x1="340" y1="280" x2="390" y2="240" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
  <line x1="340" y1="280" x2="400" y2="320" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
  <line x1="390" y1="240" x2="400" y2="320" stroke="#ffffff" stroke-width="3" opacity="0.5"/>
</svg>
